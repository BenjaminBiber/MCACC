name: Release
run-name: Release (${{ inputs.bump }}${{ inputs.prerelease && ', Pre-Release' || '' }}${{ inputs.dry_run && ', dry run' || '' }})

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Versionserhöhung gegenüber dem letzten Tag v*
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Als Pre-Release markieren
        type: boolean
        default: false
      dry_run:
        description: Nur bauen, keinen Tag und kein Release anlegen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: next
        name: Nächste Version berechnen
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          previous="${previous_tag#v}"
          previous="${previous:-0.0.0}"
          IFS=. read -r major minor patch <<< "${previous%%-*}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unbekannte Erhöhung: $BUMP" >&2; exit 1 ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version existiert bereits." >&2
            exit 1
          fi
          echo "previous=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### MCACC $version" >> "$GITHUB_STEP_SUMMARY"
          echo "Vorher: ${previous_tag:-keine}, Erhöhung: $BUMP" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Testen, bauen, Installer erzeugen
        shell: pwsh
        run: ./scripts/publish-windows.ps1 -Version ${{ needs.version.outputs.version }} -Installer

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            artifacts/MCACC-*-win-x64.zip
            artifacts/MCACC-*-win-x64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (Universal)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: App-Bundle, Zip und DMG bauen
        run: ./scripts/build-macos.sh --arch universal --version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            artifacts/MCACC-*-macos-universal.zip
            artifacts/MCACC-*-macos-universal.dmg
          if-no-files-found: error

  release:
    name: GitHub-Release
    needs: [version, windows, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Tag und Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          ls -la dist
          cat > notes.md <<EOF
          ## Download

          | System | Datei |
          | --- | --- |
          | Windows 11 (Installer) | \`MCACC-$VERSION-win-x64-setup.exe\` |
          | Windows 11 (portabel) | \`MCACC-$VERSION-win-x64.zip\` |
          | macOS 14+ (Apple Silicon & Intel) | \`MCACC-$VERSION-macos-universal.dmg\` |

          Die Binaries sind nicht signiert: Windows meldet SmartScreen (*Weitere Informationen* → *Trotzdem ausführen*),
          macOS Gatekeeper (Rechtsklick → *Öffnen* oder \`xattr -dr com.apple.quarantine /Applications/MCACC.app\`).
          EOF
          args=(--target "$GITHUB_SHA" --title "MCACC $VERSION" --notes-file notes.md --generate-notes)
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "$PREVIOUS"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}" dist/*
